<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1f2933"/></marker></defs>
<rect width="1180" height="470" fill="#ffffff"/>
<text x="20" y="28" font-size="15" font-weight="700" fill="#1f2933">Attention encoder + quantum-inspired ELM head + GWO selection (this repository's implementation)</text>
<text x="20" y="46" font-size="10" fill="#52606d">Tensor shapes for batch B. Solid arrows: inference path (CXR of features flows left to right). Dashed: training-time only.</text>
<rect x="20" y="90" width="110" height="56" rx="8" fill="#e3ecf7" stroke="#2f5d8a" stroke-width="1.5"/><text x="75.0" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2933">input</text><text x="75.0" y="130" text-anchor="middle" font-size="10" fill="#3e4c59">x : (B, 48)</text>
<rect x="150" y="90" width="160" height="56" rx="8" fill="#e3ecf7" stroke="#2f5d8a" stroke-width="1.5"/><text x="230.0" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2933">W_e + GELU</text><text x="230.0" y="130" text-anchor="middle" font-size="10" fill="#3e4c59">(B, 128) -> bottleneck (B, 64)</text>
<rect x="330" y="90" width="160" height="56" rx="8" fill="#e3ecf7" stroke="#2f5d8a" stroke-width="1.5"/><text x="410.0" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2933">expand 64 -> 256</text><text x="410.0" y="130" text-anchor="middle" font-size="10" fill="#3e4c59">learned; repair of the paper's reshape</text>
<rect x="520" y="90" width="160" height="56" rx="8" fill="#e3ecf7" stroke="#2f5d8a" stroke-width="1.5"/><text x="600.0" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2933">tokens + index emb.</text><text x="600.0" y="130" text-anchor="middle" font-size="10" fill="#3e4c59">(B, 8, 32) + (1, 8, 32)</text>
<rect x="700" y="90" width="160" height="56" rx="8" fill="#e3ecf7" stroke="#2f5d8a" stroke-width="1.5"/><text x="780.0" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2933">8-head attention</text><text x="780.0" y="130" text-anchor="middle" font-size="10" fill="#3e4c59">d_k 32, concat 256, W_O -> 32</text>
<rect x="880" y="90" width="160" height="56" rx="8" fill="#e3ecf7" stroke="#2f5d8a" stroke-width="1.5"/><text x="960.0" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2933">LN, FFN x4, LN</text><text x="960.0" y="130" text-anchor="middle" font-size="10" fill="#3e4c59">residuals; flatten (B, 256)</text>
<line x1="130" y1="118" x2="150" y2="118" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="310" y1="118" x2="330" y2="118" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="490" y1="118" x2="520" y2="118" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="680" y1="118" x2="700" y2="118" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="860" y1="118" x2="880" y2="118" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="14" y="78" width="1036" height="82" rx="10" fill="none" stroke="#2f5d8a" stroke-dasharray="3 3"/>
<text x="24" y="172" font-size="10" fill="#2f5d8a">Phase 1: trained with Adam on focal loss via a temporary softmax head (inner-validation early stopping), then FROZEN</text>
<rect x="330" y="230" width="160" height="56" rx="8" fill="#f5e9dd" stroke="#c0642f" stroke-width="1.5"/><text x="410.0" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2933">fixed hidden 1</text><text x="410.0" y="270" text-anchor="middle" font-size="10" fill="#3e4c59">GELU; W = rho cos t + (1 - rho) sin t</text>
<rect x="520" y="230" width="160" height="56" rx="8" fill="#f5e9dd" stroke="#c0642f" stroke-width="1.5"/><text x="600.0" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2933">fixed hidden 2</text><text x="600.0" y="270" text-anchor="middle" font-size="10" fill="#3e4c59">(B, n_h); weights never trained</text>
<rect x="700" y="230" width="160" height="56" rx="8" fill="#f5e9dd" stroke="#c0642f" stroke-width="1.5"/><text x="780.0" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2933">fixed hidden 3</text><text x="780.0" y="270" text-anchor="middle" font-size="10" fill="#3e4c59">(B, n_h) + bias column</text>
<rect x="880" y="230" width="160" height="56" rx="8" fill="#f5e9dd" stroke="#c0642f" stroke-width="1.5"/><text x="960.0" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2933">solved output</text><text x="960.0" y="270" text-anchor="middle" font-size="10" fill="#3e4c59">beta = (H'H + (l1+l2) I)^-1 H'T</text>
<line x1="490" y1="258" x2="520" y2="258" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="680" y1="258" x2="710" y2="258" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="860" y1="258" x2="890" y2="258" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="960" y1="146" x2="960" y2="190" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="960" y1="190" x2="410" y2="190" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="410" y1="190" x2="410" y2="230" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="430" y="200" font-size="10" fill="#c0642f">frozen features (B, 256), numpy from here on</text>
<rect x="320" y="218" width="730" height="82" rx="10" fill="none" stroke="#c0642f" stroke-dasharray="3 3"/>
<text x="330" y="312" font-size="10" fill="#c0642f">Phase 2: quantum-inspired ELM = classical trigonometric random features; closed-form ridge solve via scipy.linalg.solve, streaming H'H and H'T</text>
<rect x="1060" y="230" width="100" height="56" rx="8" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.5"/><text x="1110.0" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2933">scores</text><text x="1110.0" y="270" text-anchor="middle" font-size="10" fill="#3e4c59">(B, C) argmax</text>
<line x1="1040" y1="258" x2="1060" y2="258" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="335" width="1140" height="92" rx="10" fill="#e6f2e8" stroke="#4b8b5f" stroke-width="1.5"/>
<text x="34" y="356" font-size="12" font-weight="600" fill="#1f2933">Offline loop beside training: Grey Wolf Optimizer (training-time selection only, separate module from the encoder optimizer)</text>
<text x="34" y="376" font-size="10" fill="#3e4c59">7-dim space (Table 3): L, n_h, activation, lambda1, lambda2, theta, rho. N wolves, T iterations, a(t) = 2(1 - t/T). Fitness = k-fold macro-F1 on the TRAINING partition of the frozen features.</text>
<text x="34" y="394" font-size="10" fill="#3e4c59">Each fitness call re-initialises fixed hidden layers with the candidate (theta, rho, L, n_h, activation), solves beta with (lambda1 + lambda2), scores the held-out inner fold. Best candidate is then solved once on all training rows.</text>
<text x="34" y="412" font-size="10" fill="#3e4c59">The test partition is never seen by GWO, by early stopping, or by preprocessing statistics.</text>
<line x1="600" y1="335" x2="600" y2="288" stroke="#4b8b5f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="20" y="456" font-size="8.5" fill="#7b8794">Original drawing for this repository. The block sequence follows the textual description in the source article (Discover Artificial Intelligence, 2026, doi 10.1007/s44163-026-01704-3, CC BY 4.0); the 64 to 256 expansion is this repository's documented repair (audit item 1). No publisher figure is copied.</text>
</svg>