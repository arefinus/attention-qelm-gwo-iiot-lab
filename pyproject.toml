[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-qelm-gwo-iiot-lab"
version = "0.1.0"
description = "Independent implementation of an attention encoder with a fixed-weight extreme learning machine head and grey wolf hyperparameter search for IIoT intrusion detection, with a fidelity audit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Md Sultanul Arefin Sourav" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
attention-qelm-gwo-iiot-lab = "attention_qelm_gwo_iiot_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
