# 48-feature manifest for the processed Edge-IIoTset table used by the source paper.
#
# LOUD WARNING. The exact processed column schema is NOT verifiable from the paper:
# the paper reports 48 retained features after dropping constant, duplicate and
# metadata columns, but does not list their names. The slot names below
# (feature_01 .. feature_48) are PLACEHOLDERS. Before running the real-data adapter,
# replace each `name` with the column name produced by YOUR OWN preprocessing of the
# Edge-IIoTset release. The raw release columns are NOT assumed to equal these slots,
# and the adapter refuses any CSV whose feature columns do not match this manifest
# exactly (no silent truncation, no positional guessing).
#
# dtype is either `numeric` (median imputation) or `categorical` (mode imputation,
# label-encoded). Set it per column from your processed table.
schema_version: 1
source: edge-iiotset-processed
n_features: 48
label_column: label
# Columns that the paper drops before modelling (frame number, timestamp, raw IP
# addresses). If they are present in the CSV they are removed and never used as
# features. Any OTHER column not listed in `features` is an error.
drop_columns:
  - frame.number
  - frame.time
  - ip.src_host
  - ip.dst_host
features:
  - name: feature_01
    dtype: numeric
  - name: feature_02
    dtype: numeric
  - name: feature_03
    dtype: numeric
  - name: feature_04
    dtype: numeric
