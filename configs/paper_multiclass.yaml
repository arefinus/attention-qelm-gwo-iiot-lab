# Settings taken from the source paper (15-class task). These are configuration values,
# not results. Running this config on the authored fixture does NOT reproduce the paper.
# Real-data runs require --data-root and a filled feature manifest.
name: paper_multiclass
task: multiclass
seed: 42
classes_file: configs/classes.yaml
manifest_file: configs/feature_manifest_paper.yaml
data:
  source: fixture            # fixture | data-root
  fixture_dir: examples/fixtures/v1
  test_fraction: 0.20        # stratified 80/20 outer split
  inner_folds: 5             # stratified k-fold within the training partition only
preprocess:
  drop_missing_above: 0.40
  inf_policy: column_max
  scaler: minmax
encoder:
  input_dim: 48
  hidden_dim: 128
  bottleneck_dim: 64
  tokenisation: expand64to256   # expand64to256 | direct48to256 (audit item 1)
  n_tokens: 8
  token_dim: 32
  n_heads: 8
  head_dim: 32
  ffn_multiplier: 4
  dropout: 0.10
  optimizer: adam
  lr: 0.001
  betas: [0.9, 0.999]
  batch_size: 32
  max_epochs: 100
  patience: 15
  focal_gamma: 2.0
  focal_alpha: 0.25
  class_weighting: inverse_frequency
qelm:
  n_layers: 3
  n_hidden: 512
  activation: gelu
  lambda1: 3.2e-4
  lambda2: 1.7e-3
  theta: 1.84
  rho: 0.63
  global_angle_mode: shift     # shift | none (audit item 5)
  weight_scale: fan_in         # fan_in | none (audit item 5, implementation choice)
  solver: ridge                # ridge (paper form) | elastic_net_cd (extension)
search:
  enabled: true
  gwo_file: configs/gwo_paper.yaml
evaluation:
  seeds: [7, 13, 21, 42, 99]
  baselines: [logistic_regression, random_forest, hist_gradient_boosting]
